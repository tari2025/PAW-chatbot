<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Kelola Chatbot - Admin Puskesmas</title>
    <link rel="stylesheet" href="../css/style.css" />

    <style>
      .kelola-page {
        max-width: 1150px;
        margin: 40px auto;
        padding: 20px;
      }

      .kelola-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 24px;
      }

      .kelola-top h1 {
        color: #287c7e;
        margin: 0;
      }

      .btn {
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
      }

      .btn-back {
        background: #e9ecef;
        color: #333;
      }
      .btn-simpan {
        background: #287c7e;
        color: white;
      }
      .btn-reset {
        background: #e9ecef;
        color: #333;
      }
      .btn-edit {
        background: #ffc107;
        color: #333;
        padding: 6px 12px;
      }
      .btn-hapus {
        background: #e94444;
        color: white;
        padding: 6px 12px;
      }

      .chatbot-form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        background: white;
        padding: 24px;
        border-radius: 14px;
        box-shadow: 0 3px 12px #00000012;
        margin-bottom: 30px;
      }

      .chatbot-form .full {
        grid-column: 1 / -1;
      }

      .chatbot-form label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
        color: #333;
      }

      .chatbot-form input,
      .chatbot-form textarea,
      .chatbot-form select {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-family: inherit;
        font-size: 14px;
      }

      .chatbot-form input:focus,
      .chatbot-form textarea:focus,
      .chatbot-form select:focus {
        outline: none;
        border-color: #287c7e;
        box-shadow: 0 0 0 3px rgba(40, 124, 126, 0.15);
      }

      .chatbot-form .form-actions {
        grid-column: 1 / -1;
        display: flex;
        gap: 12px;
      }

      /* ====== TABEL ====== */
      .tabel-wrapper {
        background: white;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 3px 12px #00000012;
        overflow-x: auto;
      }

      .tabel-chatbot {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      .tabel-chatbot th,
      .tabel-chatbot td {
        padding: 12px;
        border-bottom: 1px solid #eee;
        text-align: left;
        vertical-align: top;
      }

      .tabel-chatbot th {
        background: #f1f8f8;
        color: #287c7e;
        font-weight: 700;
      }

      .tabel-chatbot tr:hover {
        background: #f9fbfb;
      }

      .badge {
        display: inline-block;
        background: #e7f1ff;
        color: #0d6efd;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
      }

      @media (max-width: 600px) {
        .chatbot-form {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <nav class="navbar">
        <a href="../homepage.html" class="logo-container">
          <img class="logo" src="../assets/logo.png" alt="Logo Puskesmas" />
          <div class="logo-text">
            <h4>Puskesmas</h4>
            <p>Sehat pilihan kita</p>
          </div>
        </a>
        <ul class="nav-links">
          <li><a href="../homepage.html">Home</a></li>
          <li><a href="informasi.html">Informasi</a></li>
          <li><a href="medichat.html">Medi-Chat</a></li>
          <li><a href="landing-page.html">Tentang Puskesmas</a></li>
        </ul>
      </nav>
    </header>

    <main class="kelola-page">
      <div class="kelola-top">
        <h1>🤖 Kelola Chatbot AI</h1>
        <a href="admin.html" class="btn btn-back">← Kembali ke Admin</a>
      </div>

      <!-- ============ FORM ============ -->
      <form id="chatbot-form" class="chatbot-form" onsubmit="return false;">
        <input type="hidden" id="chatbot-id" />

        <div class="full">
          <label for="pertanyaan">Pertanyaan</label>
          <input
            type="text"
            id="pertanyaan"
            placeholder="Contoh: Jam buka puskesmas?"
            required
          />
        </div>

        <div class="full">
          <label for="jawaban">Jawaban</label>
          <textarea
            id="jawaban"
            rows="3"
            placeholder="Contoh: Puskesmas buka Senin-Jumat, 08.00-16.00 WIB."
            required
          ></textarea>
        </div>

        <div>
          <label for="kategori">Kategori</label>
          <select id="kategori">
            <option value="umum">Umum</option>
            <option value="jadwal">Jadwal</option>
            <option value="layanan">Layanan</option>
            <option value="obat">Obat</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="button" id="btn-simpan" class="btn btn-simpan">
            💾 Simpan
          </button>
          <button type="button" id="btn-reset" class="btn btn-reset">
            🔄 Reset
          </button>
        </div>
      </form>

      <!-- ============ TABEL ============ -->
      <div class="tabel-wrapper">
        <table class="tabel-chatbot">
          <thead>
            <tr>
              <th style="width: 50px">No</th>
              <th>Pertanyaan</th>
              <th>Jawaban</th>
              <th style="width: 110px">Kategori</th>
              <th style="width: 160px">Aksi</th>
            </tr>
          </thead>
          <tbody id="body-chatbot"></tbody>
        </table>
      </div>
    </main>

    <script src="../js/data.js"></script>
    <script>
      /* ============ PROTEKSI HALAMAN ============ */
      (function () {
        const D = window.MediChatData;
        if (!D || !D.isLoggedIn || !D.isLoggedIn()) {
          alert("Anda harus login terlebih dahulu.");
          window.location.href = "admin.html";
        }
      })();
    </script>
    <script src="../js/chatbot-admin.js"></script>
  </body>
</html>
